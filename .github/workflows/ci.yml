on:
  push:
    branches:
      - main
  pull_request:

name: CI

jobs:
  fmt:
    runs-on: ubuntu-latest
    name: Check formatting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: check Java formatting
        uses: axel-op/googlejavaformat-action@c1134ebd196c4cbffb077f9476585b0be8b6afcd # v4.0.0
        with:
          args: "--aosp --set-exit-if-changed"

  cargo-deny:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: aarch64-apple-ios
          - target: aarch64-linux-android
          - target: i686-pc-windows-gnu
          - target: i686-pc-windows-msvc
          - target: x86_64-pc-windows-gnu
          - target: x86_64-pc-windows-msvc
          - target: x86_64-unknown-linux-gnu

    name: cargo-deny ${{ matrix.target }}
    runs-on: ubuntu-22.04
    needs: find-msrv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: ${{ needs.find-msrv.outputs.version }}
          log-level: error
          command: check
          arguments: --target  ${{ matrix.target }}

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            adapters: "-p accesskit_windows"
          - os: macOS-latest
            name: macOS
            adapters: "-p accesskit_macos"
          - os: ubuntu-latest
            name: Linux
            adapters: "-p accesskit_unix"
            extra_adapter_clippy: "-p accesskit_atspi_common --all-features"
          - os: ubuntu-latest
            name: Android
            adapters: "-p accesskit_android"
          - os: macOS-latest
            name: iOS Simulator
            target: "aarch64-apple-ios-sim"
            adapters: "-p accesskit_ios"
    name: cargo clippy (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.target }}

      - name: restore cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo clippy (common packages)
        run: cargo clippy -p accesskit -p accesskit_consumer -p accesskit_winit -p example_common ${{ matrix.target && format('--target {0}', matrix.target) }} --all-targets -- -D warnings

      - name: cargo clippy (adapters)
        run: cargo clippy ${{ matrix.adapters }} ${{ matrix.target && format('--target {0}', matrix.target) }} --all-targets -- -D warnings

      - name: cargo clippy (extra adapters)
        if: ${{ matrix.extra_adapter_clippy }}
        run: cargo clippy ${{ matrix.extra_adapter_clippy }} --all-targets -- -D warnings

  doc:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            adapters: "-p accesskit_windows"
          - os: macOS-latest
            name: macOS
            adapters: "-p accesskit_macos"
          - os: ubuntu-latest
            name: Linux
            adapters: "-p accesskit_unix"
            extra_adapter_doc: "-p accesskit_atspi_common --all-features"
          - os: ubuntu-latest
            name: Android
            adapters: "-p accesskit_android"
          - os: macOS-latest
            name: iOS Simulator
            target: "aarch64-apple-ios-sim"
            adapters: "-p accesskit_ios"
    name: cargo doc (${{ matrix.name }})
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: restore cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo doc (common packages)
        run: cargo doc -p accesskit -p accesskit_consumer -p accesskit_winit --features winit/wayland-dlopen ${{ matrix.target && format('--target {0}', matrix.target) }}

      - name: cargo doc (adapters)
        run: cargo doc ${{ matrix.adapters }} ${{ matrix.target && format('--target {0}', matrix.target) }}

      - name: cargo doc (extra adapters)
        if: ${{ matrix.extra_adapter_doc }}
        run: cargo doc ${{ matrix.extra_adapter_doc }}

  find-msrv:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.step2.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: step2
        run: echo "version=`cat Cargo.toml | sed -n 's/rust-version = "\(.*\)"/\1/p'`" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ${{ matrix.os }}
    needs: find-msrv
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            adapters: "-p accesskit_windows"
          - os: macOS-latest
            name: macOS
            adapters: "-p accesskit_macos"
          - os: ubuntu-latest
            name: Linux
            adapters: "-p accesskit_atspi_common -p accesskit_unix"
          - os: ubuntu-latest
            name: Android
            adapters: "-p accesskit_android"
          - os: macOS-latest
            name: iOS Simulator
            target: "aarch64-apple-ios-sim"
            adapters: "-p accesskit_ios"
    name: cargo test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ needs.find-msrv.outputs.version }}
          targets: ${{ matrix.target }}

      - name: restore cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo test (common packages)
        run: cargo test -p accesskit -p accesskit_consumer -p accesskit_winit ${{ matrix.target && format('--target {0}', matrix.target) }}

      - name: cargo test (adapters)
        run: cargo test ${{ matrix.adapters }} ${{ matrix.target && format('--target {0}', matrix.target) }}

  check-android-dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-30"
      - run: sdkmanager "build-tools;33.0.2"
      - run: cp adapters/android/classes.dex adapters/android/classes.dex.orig
      - run: ./adapters/android/build-dex.sh
      - run: cmp adapters/android/classes.dex.orig adapters/android/classes.dex
