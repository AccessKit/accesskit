name: AccessKit Winit Examples
options:
  bundleIdPrefix: dev.accesskit
settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Simple:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    info:
        path: Info.plist
        properties:
            UILaunchScreen:
                ImageRespectSafeAreaInsets: false
    sources: []
    postCompileScripts:
      - script: |
          ../../../ios/examples/apple/build_with_cargo.bash simple \
            --no-default-features --features rwh_06
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
  MixedHandlers:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    info:
        path: Info.plist
        properties:
            UILaunchScreen:
                ImageRespectSafeAreaInsets: false
    sources: []
    postCompileScripts:
      - script: |
          ../../../ios/examples/apple/build_with_cargo.bash mixed_handlers \
            --no-default-features --features rwh_06
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
