[package]
name = "accesskit_atspi_common"
version = "0.20.1"
authors.workspace = true
license.workspace = true
description = "AccessKit UI accessibility infrastructure: core AT-SPI translation layer"
categories.workspace = true
keywords = ["gui", "ui", "accessibility"]
repository.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true

[features]
simplified-api = []

[dependencies]
accesskit = { version = "0.25.0", path = "../../accesskit" }
accesskit_consumer = { version = "0.39.0", path = "../../accesskit_consumer" }
atspi-common = { version = "0.13", default-features = false }
phf = { version = "0.14.0", features = ["macros"] }
serde = "1.0"
zvariant = { version = "5.4", default-features = false }
